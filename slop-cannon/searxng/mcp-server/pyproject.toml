[project]
name = "searxng-mcp"
version = "0.1.0"
description = "MCP server exposing a SearXNG instance as a web search tool"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
searxng-mcp = "searxng_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
